# Checks the live in-browser demos in a real (headless) browser, as a visitor would use them.
name: browser-check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/browser-check.yml", ".github/browser-check/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: .github/browser-check
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Use the demos like a visitor
        working-directory: .github/browser-check
        run: node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: .github/browser-check/*.png
