# Builds the in-browser ML demos on this site from their project repos.
# rag-eval-lab: exports passages and the Python pipeline's results, embeds the passages with the same
# ONNX model the page uses, checks the JavaScript port against Python, then publishes /rag-eval-lab/.
name: ml-demos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ml-demos.yml", "demos/**"]

permissions:
  contents: write

concurrency:
  group: ml-demos
  cancel-in-progress: false

jobs:
  rag-eval-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: exotic-Siddharth/rag-eval-lab
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests for the JavaScript port
        working-directory: src/web
        run: |
          npm ci --no-audit --no-fund
          node --test test_rag.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install raglab (CPU)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "./src[ml]"

      - name: Export passages, examples and the Python pipeline's results
        working-directory: src
        run: python web/export_data.py --config configs/default.yaml --out web/build

      - name: Embed the passages with the in-browser model
        working-directory: src/web
        run: node embed_chunks.mjs build

      - name: Parity check against the Python pipeline
        working-directory: src/web
        run: node parity.mjs build

      - name: Model download size (what a visitor downloads once)
        working-directory: src/web
        continue-on-error: true
        run: |
          CACHE=$(node -e 'import("@huggingface/transformers").then((m) => console.log(m.env.cacheDir))')
          echo "cache: $CACHE"
          find "$CACHE" -type f -printf "%s %p\n" | sort -n | tail -12 || true
          find "$CACHE" -type f -printf "%s\n" | awk '{s+=$1} END {printf "total: %.1f MB\n", s/1e6}' || true
          ls -la build || true

      - name: Publish to /rag-eval-lab/
        run: |
          rm -rf rag-eval-lab && mkdir -p rag-eval-lab/data
          cp src/web/index.html src/web/rag.js src/web/models.js rag-eval-lab/
          cp src/web/build/chunks.json src/web/build/embeddings.bin src/web/build/examples.json \
             src/web/build/meta.json src/web/build/parity.json rag-eval-lab/data/
          git add rag-eval-lab
          if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update rag-eval-lab in-browser demo (rag-eval-lab@$(git -C src rev-parse --short HEAD))"
          git push
